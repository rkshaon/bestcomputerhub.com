# File: /docker-compose.yml

services:
  frontend:
    container_name: bestcomputerhub-frontend

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:3001:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # - NUXT_PUBLIC_API_BASE=http://localhost:8000/api/v1/
      # - NUXT_PUBLIC_APP_URL=http://localhost:3000
    restart: unless-stopped
